spring.application.name=news-service
server.port=8085

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${NEWS_DATABASE_URL:jdbc:postgresql://news-db:5432/news_service}
spring.datasource.username=${NEWS_DATABASE_USERNAME:postgres}
spring.datasource.password=${NEWS_DATABASE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

news.provider.enabled=${NEWS_PROVIDER_ENABLED:false}
news.provider.max-age=${NEWS_PROVIDER_MAX_AGE:PT15M}
# Attribution is resolved from normalized sourceName values, not hardcoded in the API.
news.provider.attributions.xoomar=${NEWS_XOOMAR_ATTRIBUTION:Data: XOOMAR (https://xoomar.com/markets/api/calendar)}
news.provider.attributions.alpha-vantage=${NEWS_ALPHA_VANTAGE_ATTRIBUTION:Data: Alpha Vantage (https://www.alphavantage.co/)}
news.xoomar.enabled=${NEWS_XOOMAR_ENABLED:false}
# XOOMAR calendar data is for internal/personal use only; do not redistribute it.
# Public event responses must retain the XOOMAR attribution exposed by NewsController.
news.xoomar.base-url=${NEWS_XOOMAR_BASE_URL:https://xoomar.com}
news.xoomar.poll-interval=${NEWS_XOOMAR_POLL_INTERVAL:PT15M}
news.xoomar.lookback-days=${NEWS_XOOMAR_LOOKBACK_DAYS:1}
news.xoomar.lookahead-days=${NEWS_XOOMAR_LOOKAHEAD_DAYS:7}

news.providers.alpha-vantage.enabled=${NEWS_ALPHA_VANTAGE_ENABLED:false}
news.providers.alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:}
# Alpha Vantage requires the credential in the query string. Do not enable
# HTTP wire/access logging for this client without query-parameter redaction.
news.providers.alpha-vantage.polling-enabled=${NEWS_ALPHA_VANTAGE_POLLING_ENABLED:false}
news.providers.alpha-vantage.base-url=${NEWS_ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co}
news.providers.alpha-vantage.poll-interval=${NEWS_ALPHA_VANTAGE_POLL_INTERVAL:PT6H}
news.providers.alpha-vantage.lookback=${NEWS_ALPHA_VANTAGE_LOOKBACK:PT48H}
news.providers.alpha-vantage.limit=${NEWS_ALPHA_VANTAGE_LIMIT:50}
news.providers.alpha-vantage.timeout=${NEWS_ALPHA_VANTAGE_TIMEOUT:PT15S}
news.providers.alpha-vantage.topics=${NEWS_ALPHA_VANTAGE_TOPICS:blockchain,financial_markets,economy_monetary,economy_macro,finance}
news.providers.alpha-vantage.tickers=${NEWS_ALPHA_VANTAGE_TICKERS:CRYPTO:BTC,CRYPTO:ETH,FOREX:USD}

security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.issuer=${SECURITY_JWT_ISSUER:trading-os}
security.service-jwt.enabled=${NEWS_SERVICE_JWT_ENABLED:true}
security.service-jwt.audience=news-service
security.service-jwt.authorized-callers=${NEWS_SERVICE_AUTHORIZED_CALLERS:market-intelligence}
security.service-jwt.trusted.market-intelligence=${MARKET_INTELLIGENCE_NEWS_SERVICE_JWT_SECRET:}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hope.trading=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
