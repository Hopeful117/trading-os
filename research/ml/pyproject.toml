[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-os-research-dataset"
version = "0.1.0"
description = "Offline validation for Trading OS research dataset bundles"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.7.1",
    "matplotlib==3.10.3",
    "jupyterlab==4.4.3",
    "nbclient==0.10.2",
]

[project.scripts]
research-dataset = "research_dataset.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
