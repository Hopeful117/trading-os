[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-os-research-dataset"
version = "0.1.0"
description = "Offline validation for Trading OS research dataset bundles"
requires-python = ">=3.11"

[project.scripts]
research-dataset = "research_dataset.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
