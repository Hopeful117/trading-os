spring.datasource.url=jdbc:h2:mem:trading_core;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.jpa.open-in-view=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.task.scheduling.enabled=false
security.jwt.secret=test-secret-key-that-is-at-least-32-bytes-long
security.jwt.expiration=3600000
security.jwt.issuer=trading-os-test
logging.level.root=WARN
risk.acknowledgment.retry-delay=3600000
risk.acknowledgment.retry-initial-delay=3600000
