spring.application.name=trading-core
server.port=8081

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres:5432/trading_os
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.discovery.enabled=true
eureka.client.fetch-registry=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:3600000}
security.jwt.issuer=${JWT_ISSUER:default-issuer}
security.service-jwt.enabled=${SERVICE_JWT_ENABLED:true}
security.service-jwt.name=trading-core
security.service-jwt.secret=${TRADING_CORE_SERVICE_JWT_SECRET:}
security.service-jwt.expiration-seconds=${SERVICE_JWT_EXPIRATION_SECONDS:60}
security.service-jwt.audience-secrets.market-intelligence=${TRADING_CORE_MI_SERVICE_JWT_SECRET:}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hope.trading=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
