spring.datasource.url=jdbc:h2:mem:market_data;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=SET TIME ZONE 'UTC'
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
kraken.base-url=https://example.invalid
kraken.websocket=wss://example.invalid
market-data.websocket.allowed-origins=http://localhost:17085,http://localhost:4200
logging.level.root=WARN
security.service-jwt.enabled=true
security.service-jwt.audience=market-data
