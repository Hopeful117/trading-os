spring.application.name=market-data
server.port=8083

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.discovery.enabled=true
eureka.client.fetch-registry=true

kraken.base-url=${KRAKEN_BASE_URL}
kraken.websocket=${KRAKEN_WEBSOCKET}
kraken.connect-timeout=5s
kraken.read-timeout=18s
market-data.snapshot.stale-after=${MARKET_DATA_SNAPSHOT_STALE_AFTER:30s}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://market-data-db:5432/market_data
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

valuation.max-observation-age=${VALUATION_MAX_OBSERVATION_AGE:PT5M}

security.service-jwt.enabled=${MARKET_DATA_SERVICE_JWT_ENABLED:true}
security.service-jwt.audience=market-data
security.service-jwt.authorized-caller=trading-core
security.service-jwt.trusted.trading-core=${TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET:}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hope.trading=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
