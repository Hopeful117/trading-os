spring.application.name=market-data
server.port=8083

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.discovery.enabled=true
eureka.client.fetch-registry=true

kraken.base-url=${KRAKEN_BASE_URL}
kraken.futures-base-url=${KRAKEN_FUTURES_BASE_URL:https://futures.kraken.com}
kraken.futures-charts-base-url=${KRAKEN_FUTURES_CHARTS_BASE_URL:https://futures.kraken.com/api/charts/v1}
kraken.websocket=${KRAKEN_WEBSOCKET}
kraken.futures-websocket=${KRAKEN_FUTURES_WEBSOCKET:wss://futures.kraken.com/ws/v1}
kraken.connect-timeout=5s
kraken.read-timeout=18s
market-data.snapshot.stale-after=${MARKET_DATA_SNAPSHOT_STALE_AFTER:30s}
historical-ohlc.capture.enabled=${HISTORICAL_OHLC_CAPTURE_ENABLED:false}
historical-ohlc.capture.market-ids=${HISTORICAL_OHLC_CAPTURE_MARKET_IDS:}
historical-ohlc.capture.intervals=${HISTORICAL_OHLC_CAPTURE_INTERVALS:FIFTEEN_MINUTES,ONE_HOUR,FOUR_HOURS}
historical-ohlc.capture.limit=${HISTORICAL_OHLC_CAPTURE_LIMIT:200}
historical-ohlc.capture.fixed-delay=${HISTORICAL_OHLC_CAPTURE_FIXED_DELAY:PT15M}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://market-data-db:5432/market_data
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

valuation.max-observation-age=${VALUATION_MAX_OBSERVATION_AGE:PT5M}
market-data.websocket.allowed-origins=${MARKET_DATA_WEBSOCKET_ALLOWED_ORIGINS:}

security.service-jwt.enabled=${MARKET_DATA_SERVICE_JWT_ENABLED:true}
security.service-jwt.audience=market-data
security.service-jwt.authorized-caller=trading-core
security.service-jwt.trusted.trading-core=${TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET:}
security.service-jwt.market-facts-authorized-callers=${MARKET_DATA_MARKET_FACTS_AUTHORIZED_CALLERS:trading-core}
security.service-jwt.trusted.market-intelligence=${MARKET_INTELLIGENCE_MARKET_DATA_SERVICE_JWT_SECRET:}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hope.trading=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
