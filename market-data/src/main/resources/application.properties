spring.application.name=market-data
server.port=8083

market-data.startup-grace=${MARKET_DATA_STARTUP_GRACE:PT1M}

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.discovery.enabled=true
eureka.client.fetch-registry=true

kraken.base-url=${KRAKEN_BASE_URL}
kraken.futures-base-url=${KRAKEN_FUTURES_BASE_URL:https://futures.kraken.com}
kraken.futures-charts-base-url=${KRAKEN_FUTURES_CHARTS_BASE_URL:https://futures.kraken.com/api/charts/v1}
kraken.websocket=${KRAKEN_WEBSOCKET}
kraken.futures-websocket=${KRAKEN_FUTURES_WEBSOCKET:wss://futures.kraken.com/ws/v1}
kraken.connect-timeout=5s
kraken.read-timeout=18s
market-data.snapshot.stale-after=${MARKET_DATA_SNAPSHOT_STALE_AFTER:30s}
historical-ohlc.capture.enabled=${HISTORICAL_OHLC_CAPTURE_ENABLED:false}
historical-ohlc.capture.market-ids=${HISTORICAL_OHLC_CAPTURE_MARKET_IDS:}
historical-ohlc.capture.intervals=${HISTORICAL_OHLC_CAPTURE_INTERVALS:FIFTEEN_MINUTES,ONE_HOUR,FOUR_HOURS}
historical-ohlc.capture.limit=${HISTORICAL_OHLC_CAPTURE_LIMIT:200}
historical-ohlc.capture.fixed-delay=${HISTORICAL_OHLC_CAPTURE_FIXED_DELAY:PT15M}
order-book.evidence.capture.enabled=${ORDER_BOOK_EVIDENCE_CAPTURE_ENABLED:false}
order-book.retention.artifact-signing-key=${ORDER_BOOK_ARTIFACT_SIGNING_KEY:}
order-book.retention.backfill-sequence-batch-size=${ORDER_BOOK_RETENTION_BACKFILL_SEQUENCE_BATCH_SIZE:1}
order-book.retention.backfill-boundary-batch-size=${ORDER_BOOK_RETENTION_BACKFILL_BOUNDARY_BATCH_SIZE:10}
order-book.retention.backfill-max-sequence-batch-size=${ORDER_BOOK_RETENTION_BACKFILL_MAX_SEQUENCE_BATCH_SIZE:10}
order-book.retention.backfill-max-boundary-batch-size=${ORDER_BOOK_RETENTION_BACKFILL_MAX_BOUNDARY_BATCH_SIZE:100}
order-book.evidence.capture.provider-symbol=${ORDER_BOOK_EVIDENCE_CAPTURE_PROVIDER_SYMBOL:PF_XBTUSD}
order-book.evidence.capture.depth=${ORDER_BOOK_EVIDENCE_CAPTURE_DEPTH:25}
order-book.acquisition.startup-enabled=${ORDER_BOOK_ACQUISITION_STARTUP_ENABLED:false}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://market-data-db:5432/market_data
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

valuation.max-observation-age=${VALUATION_MAX_OBSERVATION_AGE:PT5M}
market-data.websocket.allowed-origins=${MARKET_DATA_WEBSOCKET_ALLOWED_ORIGINS:}

security.service-jwt.enabled=${MARKET_DATA_SERVICE_JWT_ENABLED:true}
security.service-jwt.audience=market-data
security.service-jwt.authorized-caller=trading-core
security.service-jwt.authorized-callers=${MARKET_DATA_SERVICE_JWT_AUTHORIZED_CALLERS:trading-core}
security.service-jwt.order-book-replay-authorized-callers=${MARKET_DATA_ORDER_BOOK_REPLAY_AUTHORIZED_CALLERS:market-intelligence}
security.service-jwt.order-book-retention-authorized-callers=${MARKET_DATA_ORDER_BOOK_RETENTION_AUTHORIZED_CALLERS:market-intelligence,trading-core}
security.service-jwt.trusted.trading-core=${TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET:}
security.service-jwt.market-facts-authorized-callers=${MARKET_DATA_MARKET_FACTS_AUTHORIZED_CALLERS:trading-core}
security.service-jwt.trusted.market-intelligence=${MARKET_INTELLIGENCE_MARKET_DATA_SERVICE_JWT_SECRET:}

ctrader.market-data.enabled=${CTRADER_MARKET_DATA_ENABLED:false}
ctrader.market-data.bootstrap-enabled=${CTRADER_MARKET_DATA_BOOTSTRAP_ENABLED:false}
ctrader.market-data.environment=${CTRADER_MARKET_DATA_ENVIRONMENT:}
ctrader.market-data.external-account-id=${CTRADER_MARKET_DATA_EXTERNAL_ACCOUNT_ID:0}
ctrader.market-data.authorization-endpoint=${CTRADER_MARKET_DATA_AUTHORIZATION_ENDPOINT:https://id.ctrader.com/my/settings/openapi/grantingaccess/}
ctrader.market-data.redirect-uri=${CTRADER_MARKET_DATA_REDIRECT_URI:http://localhost:17083/api/v1/ctrader/authorization/callback}
ctrader.market-data.bootstrap-access-token=${CTRADER_MARKET_DATA_BOOTSTRAP_ACCESS_TOKEN:}
ctrader.market-data.bootstrap-refresh-token=${CTRADER_MARKET_DATA_BOOTSTRAP_REFRESH_TOKEN:}
ctrader.market-data.bootstrap-ttl=${CTRADER_MARKET_DATA_BOOTSTRAP_TTL:PT1H}
ctrader.market-data.client-id=${CTRADER_MARKET_DATA_CLIENT_ID:}
ctrader.market-data.client-secret=${CTRADER_MARKET_DATA_CLIENT_SECRET:}
ctrader.market-data.token-endpoint=${CTRADER_MARKET_DATA_TOKEN_ENDPOINT:}
ctrader.market-data.websocket-endpoint=${CTRADER_MARKET_DATA_WEBSOCKET_ENDPOINT:}
ctrader.market-data.request-timeout=${CTRADER_MARKET_DATA_REQUEST_TIMEOUT:PT15S}
ctrader.market-data.authorization-state-ttl=${CTRADER_MARKET_DATA_AUTHORIZATION_STATE_TTL:PT10M}
ctrader.market-data.max-trendbar-pages=${CTRADER_MARKET_DATA_MAX_TRENDBAR_PAGES:8}
ctrader.market-data.max-trendbar-rows=${CTRADER_MARKET_DATA_MAX_TRENDBAR_ROWS:720}
ctrader.market-data.symbol-mappings.EURUSD=${CTRADER_MARKET_DATA_SYMBOL_MAPPING_EURUSD:}
ctrader.market-data.symbol-mappings.GBPUSD=${CTRADER_MARKET_DATA_SYMBOL_MAPPING_GBPUSD:}
ctrader.market-data.symbol-mappings.XAUUSD=${CTRADER_MARKET_DATA_SYMBOL_MAPPING_XAUUSD:}
ctrader.market-data.symbol-mappings[US30.cash]=${CTRADER_MARKET_DATA_SYMBOL_MAPPING_US30_CASH:}
ctrader.market-data.symbol-product-types[US30.cash]=${CTRADER_MARKET_DATA_SYMBOL_PRODUCT_TYPE_US30_CASH:CFD}
ctrader.market-data.token-encryption.master-key=${CTRADER_MARKET_DATA_TOKEN_MASTER_KEY:}
ctrader.market-data.token-encryption.key-version=${CTRADER_MARKET_DATA_TOKEN_KEY_VERSION:}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hope.trading=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
