spring.application.name=market-intelligence
server.port=8084

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${MARKET_INTELLIGENCE_DB_URL:jdbc:postgresql://market-intelligence-db:5432/market_intelligence}
spring.datasource.username=${MARKET_INTELLIGENCE_DB_USERNAME:postgres}
spring.datasource.password=${MARKET_INTELLIGENCE_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

intelligence.context.stale-after=30s
intelligence.passive.timeout=750ms
intelligence.active.timeout=3s

market-intelligence.eligibility.interval=${MARKET_INTELLIGENCE_ELIGIBILITY_INTERVAL}
market-intelligence.eligibility.activity-window-minutes=${MARKET_INTELLIGENCE_ELIGIBILITY_ACTIVITY_WINDOW_MINUTES}
market-intelligence.eligibility.readiness-lookback-candles=${MARKET_INTELLIGENCE_ELIGIBILITY_READINESS_LOOKBACK_CANDLES}
market-intelligence.eligibility.minimum-completed-candles=${MARKET_INTELLIGENCE_ELIGIBILITY_MINIMUM_COMPLETED_CANDLES}
market-intelligence.eligibility.max-observation-age-seconds=${MARKET_INTELLIGENCE_ELIGIBILITY_MAX_OBSERVATION_AGE_SECONDS}
market-intelligence.eligibility.max-market-fact-evaluations-per-scan=${MARKET_INTELLIGENCE_MAX_MARKET_FACT_EVALUATIONS_PER_SCAN}

research.lifecycle.enabled=${RESEARCH_LIFECYCLE_ENABLED:false}
research.lifecycle.market-ids=${RESEARCH_LIFECYCLE_MARKET_IDS:}
research.lifecycle.observation-cadence=${RESEARCH_LIFECYCLE_OBSERVATION_CADENCE:PT1H}
research.lifecycle.outcome-horizons=${RESEARCH_LIFECYCLE_OUTCOME_HORIZONS:PT1H,PT4H,PT24H}
research.lifecycle.fixed-delay=${RESEARCH_LIFECYCLE_FIXED_DELAY:PT1M}
research.lifecycle.fee-coverage.broker-account-id=${RESEARCH_LIFECYCLE_FEE_COVERAGE_BROKER_ACCOUNT_ID:}
research.lifecycle.fee-coverage.provider=${RESEARCH_LIFECYCLE_FEE_COVERAGE_PROVIDER:}
research.lifecycle.fee-coverage.product-type=${RESEARCH_LIFECYCLE_FEE_COVERAGE_PRODUCT_TYPE:}
research.lifecycle.fee-coverage.instrument=${RESEARCH_LIFECYCLE_FEE_COVERAGE_INSTRUMENT:}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hope.trading=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}

security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.issuer=${SECURITY_JWT_ISSUER:trading-os}
security.service-jwt.enabled=${MI_SERVICE_JWT_ENABLED:true}
security.service-jwt.audience=market-intelligence
security.service-jwt.authorized-callers=trading-core
security.service-jwt.trusted.trading-core=${TRADING_CORE_MI_SERVICE_JWT_SECRET:}
research.lifecycle.readiness-cache-duration=${RESEARCH_READINESS_CACHE_DURATION:PT30S}
