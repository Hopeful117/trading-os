spring.application.name=market-intelligence
server.port=8084

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${MARKET_INTELLIGENCE_DB_URL:jdbc:postgresql://market-intelligence-db:5432/market_intelligence}
spring.datasource.username=${MARKET_INTELLIGENCE_DB_USERNAME:postgres}
spring.datasource.password=${MARKET_INTELLIGENCE_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

intelligence.context.stale-after=30s
intelligence.passive.timeout=750ms
intelligence.active.timeout=3s

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hope.trading=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}

security.jwt.secret=${SECURITY_JWT_SECRET:}
security.jwt.issuer=${SECURITY_JWT_ISSUER:trading-os}
security.service-jwt.enabled=${MI_SERVICE_JWT_ENABLED:true}
security.service-jwt.audience=market-intelligence
security.service-jwt.authorized-callers=trading-core
security.service-jwt.trusted.trading-core=${TRADING_CORE_MI_SERVICE_JWT_SECRET:}
