<div class="error-container">
  <div class="error-card">
    <div class="status">
      {{ status }}
    </div>

    <h1>
      {{ title }}
    </h1>

    <p>
      {{ message }}
    </p>

    @if (status === 401) {
      <a routerLink="/login"> Se reconnecter </a>
    } @else {
      <a routerLink="/dashboard"> Retour au dashboard </a>
    }
  </div>
</div>
