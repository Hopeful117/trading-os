<div class="login-container">
  <h2>Inscription</h2>

  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Nom d'utilisateur</label>
      <input type="text" name="username" [(ngModel)]="registerRequest.username" />
    </div>

    <div>
      <label>Email</label>
      <input type="email" name="email" [(ngModel)]="registerRequest.email" />
    </div>

    <div>
      <label>Mot de passe</label>
      <input type="password" name="password" [(ngModel)]="registerRequest.password" />
    </div>

    @if (errorMessage(); as error) {
      <p class="error" data-testid="register-error" role="alert">{{ error }}</p>
    }

    <button type="submit" [disabled]="loading()" data-testid="register-submit">
      {{ loading() ? 'Création…' : 'Créer un compte' }}
    </button>
  </form>
</div>
