<mat-card>
<mat-card-header>
<h2>{{ account.name }}</h2>
</mat-card-header>

  <mat-card-content>

<p>
  Base currency :
  {{ account.baseCurrency }}
</p>
<div>
  <h3>Balances</h3>
  @for (balance of getBalances(account); track balance.asset) {
    <app-account-card
      [account]="account">
    </app-account-card>
  }
</div>
  </mat-card-content>

</mat-card>
