<mat-card>
<mat-card-header>
<h2>{{ account.name }}</h2>
</mat-card-header>

  <mat-card-content>

<p>
  Base currency :
  {{ account.baseCurrency }}
</p>
<div>
  <h3>Balances</h3>
  @for (balance of balances; track balance.asset) {
    <p>
      {{ balance.asset }} :
      {{ balance.amount }}
    </p>

  }
</div>
  </mat-card-content>

</mat-card>
