<h1>Accounts</h1>
<button (click)="sync()">
  Synchroniser Kraken
</button>
<div class="accounts-container">
  

  @for(account of accounts; track account.accountId) {

    <app-account-card
      [account]="account">
    </app-account-card>

  }

</div>
@if (errorMessage) {
  <p class="error">{{ errorMessage }}</p>
}
