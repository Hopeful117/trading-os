<div class="opportunity-details-page">
  @if (view$ | async; as view) {
    @if (view.status === 'loading') {
      <div class="state-card" data-testid="opportunity-redirect-loading">
        <span class="spinner"></span>
        <p>Opening Decision Cockpit…</p>
      </div>
    } @else {
      <div class="state-card error" data-testid="opportunity-redirect-error">
        <h2>Unable to open opportunity</h2>
        <p>The opportunity could not be loaded. Return to the opportunity inbox and try again.</p>
        <a routerLink="/opportunities" class="back-link">Back to opportunities</a>
      </div>
    }
  }
</div>
