version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  trading-app:
    build: .
    container_name: trading-app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/trading_os
    depends_on:
      - postgres
    ports:
      - "8081:8081"


  eureka-server:
    build: .
    container_name: eureka-server
    environment:
      EUREKA_SERVER_PORT: 8761
    ports:
      - "8761:8761"


  gateway:
    build: .
    container_name: gateway
    environment:
      GATEWAY_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"