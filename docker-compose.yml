services:
  postgres:
    image: postgres:16
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    networks:
      - trading-network
    volumes:
      - trading_os:/var/lib/postgresql/data

    restart: unless-stopped


  market-data-db:
    image: postgres:16
    container_name: market_data-postgres

    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - market_data:/var/lib/postgresql/data

    networks:
      - trading-network


    restart: unless-stopped

  broker-db:
    image: postgres:16
    container_name: broker-postgres
    environment:
      POSTGRES_DB: broker_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - broker_data:/var/lib/postgresql/data
    networks:
      - trading-network
    restart: unless-stopped

  market-intelligence-db:
    image: postgres:16
    container_name: market-intelligence-postgres
    environment:
      POSTGRES_DB: market_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - market_intelligence_data:/var/lib/postgresql/data
    networks:
      - trading-network
    restart: unless-stopped


  trading-app:
    build:
      context: .
      dockerfile: trading-core/Dockerfile
    container_name: trading-app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/trading_os
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:?JWT_EXPIRATION must be set}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET: ${TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET:?TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET must be set}
      TRADING_CORE_SERVICE_JWT_SECRET: ${TRADING_CORE_SERVICE_JWT_SECRET:?TRADING_CORE_SERVICE_JWT_SECRET must be set}
      BROKER_SERVICE_SERVICE_JWT_SECRET: ${BROKER_SERVICE_SERVICE_JWT_SECRET:?BROKER_SERVICE_SERVICE_JWT_SECRET must be set}
      MARKET_INTELLIGENCE_BROKER_SERVICE_JWT_SECRET: ${MARKET_INTELLIGENCE_BROKER_SERVICE_JWT_SECRET:?MARKET_INTELLIGENCE_BROKER_SERVICE_JWT_SECRET must be set}
      MARKET_INTELLIGENCE_BROKER_SERVICE_CONNECT_TIMEOUT_MS: ${MARKET_INTELLIGENCE_BROKER_SERVICE_CONNECT_TIMEOUT_MS:-2000}
      MARKET_INTELLIGENCE_BROKER_SERVICE_READ_TIMEOUT_MS: ${MARKET_INTELLIGENCE_BROKER_SERVICE_READ_TIMEOUT_MS:-5000}
      MARKET_INTELLIGENCE_SERVICE_JWT_SECRET: ${MARKET_INTELLIGENCE_SERVICE_JWT_SECRET:?MARKET_INTELLIGENCE_SERVICE_JWT_SECRET must be set}
      TRADING_CORE_MI_SERVICE_JWT_SECRET: ${TRADING_CORE_MI_SERVICE_JWT_SECRET:?TRADING_CORE_MI_SERVICE_JWT_SECRET must be set}
    depends_on:
      - postgres
      - eureka-server
    ports:
      - "17081:8081"

    networks:
      - trading-network

    restart: unless-stopped

  broker-service:
    build: ./broker-service
    container_name: broker-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      KRAKEN_BASE_URL: ${KRAKEN_BASE_URL}
      KRAKEN_FUTURES_BASE_URL: ${KRAKEN_FUTURES_BASE_URL:-https://futures.kraken.com}
      KRAKEN_API_KEY: ${KRAKEN_API_KEY}
      KRAKEN_API_SECRET: ${KRAKEN_API_SECRET}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      TRADING_CORE_SERVICE_JWT_SECRET: ${TRADING_CORE_SERVICE_JWT_SECRET:?TRADING_CORE_SERVICE_JWT_SECRET must be set}
      BROKER_SERVICE_SERVICE_JWT_SECRET: ${BROKER_SERVICE_SERVICE_JWT_SECRET:?BROKER_SERVICE_SERVICE_JWT_SECRET must be set}
      BROKER_DATABASE_URL: jdbc:postgresql://broker-db:5432/broker_service
      BROKER_DATABASE_USERNAME: postgres
      BROKER_DATABASE_PASSWORD: postgres
      BROKER_CREDENTIAL_SOURCE: stored
      BROKER_MASTER_KEY: ${BROKER_MASTER_KEY}
      BROKER_MASTER_KEY_VERSION: ${BROKER_MASTER_KEY_VERSION:-v1}
      HISTORICAL_FEE_SCHEDULE_CAPTURE_ENABLED: ${HISTORICAL_FEE_SCHEDULE_CAPTURE_ENABLED:-false}
      HISTORICAL_FEE_SCHEDULE_CAPTURE_FIXED_DELAY: ${HISTORICAL_FEE_SCHEDULE_CAPTURE_FIXED_DELAY:-PT1H}
      HISTORICAL_FEE_SCHEDULE_CAPTURE_BROKER_ACCOUNT_IDS: ${HISTORICAL_FEE_SCHEDULE_CAPTURE_BROKER_ACCOUNT_IDS:-}
      HISTORICAL_FEE_SCHEDULE_CAPTURE_INSTRUMENT: ${HISTORICAL_FEE_SCHEDULE_CAPTURE_INSTRUMENT:-PF_XBTUSD}
      HISTORICAL_FEE_SCHEDULE_CAPTURE_PRODUCT_TYPE: ${HISTORICAL_FEE_SCHEDULE_CAPTURE_PRODUCT_TYPE:-LINEAR_PERPETUAL}

    depends_on:
      - eureka-server
      - broker-db

    networks:
      - trading-network


    ports:
      - "17082:8082"

    restart: unless-stopped


  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "17084:8761"

    networks:
        - trading-network

    restart: unless-stopped


  gateway:
    build: ./gateway
    container_name: gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:?JWT_EXPIRATION must be set}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET: ${TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET:?TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET must be set}
    depends_on:
      - eureka-server
    ports:
      - "17080:8080"
    restart: unless-stopped
    networks:
        - trading-network


  trading-web:
    build: ./trading-os-web
    container_name: trading-web
    ports:
      - "17085:80"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - trading-network




  market-data:
    build: ./market-data
    container_name: market-data

    ports:
      - "17083:8083"

    depends_on:
      - eureka-server
      - market-data-db

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      KRAKEN_BASE_URL: ${KRAKEN_BASE_URL}
      KRAKEN_WEBSOCKET: ${KRAKEN_WEBSOCKET}
      MARKET_DATA_WEBSOCKET_ALLOWED_ORIGINS: ${MARKET_DATA_WEBSOCKET_ALLOWED_ORIGINS:?MARKET_DATA_WEBSOCKET_ALLOWED_ORIGINS must be set}
      TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET: ${TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET:?TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET must be set}
      MARKET_INTELLIGENCE_MARKET_DATA_SERVICE_JWT_SECRET: ${MARKET_INTELLIGENCE_MARKET_DATA_SERVICE_JWT_SECRET:-${MARKET_INTELLIGENCE_SERVICE_JWT_SECRET:?MARKET_INTELLIGENCE_SERVICE_JWT_SECRET must be set}}
      MARKET_INTELLIGENCE_MARKET_DATA_CONNECT_TIMEOUT_MS: ${MARKET_INTELLIGENCE_MARKET_DATA_CONNECT_TIMEOUT_MS:-2000}
      MARKET_INTELLIGENCE_MARKET_DATA_READ_TIMEOUT_MS: ${MARKET_INTELLIGENCE_MARKET_DATA_READ_TIMEOUT_MS:-5000}
      MARKET_DATA_MARKET_FACTS_AUTHORIZED_CALLERS: ${MARKET_DATA_MARKET_FACTS_AUTHORIZED_CALLERS:-trading-core,market-intelligence}
      MARKET_DATA_SERVICE_JWT_AUTHORIZED_CALLERS: ${MARKET_DATA_SERVICE_JWT_AUTHORIZED_CALLERS:-trading-core}
      MARKET_DATA_ORDER_BOOK_REPLAY_AUTHORIZED_CALLERS: ${MARKET_DATA_ORDER_BOOK_REPLAY_AUTHORIZED_CALLERS:-market-intelligence}
      HISTORICAL_OHLC_CAPTURE_ENABLED: ${HISTORICAL_OHLC_CAPTURE_ENABLED:-false}
      HISTORICAL_OHLC_CAPTURE_MARKET_IDS: ${HISTORICAL_OHLC_CAPTURE_MARKET_IDS:-}
      HISTORICAL_OHLC_CAPTURE_INTERVALS: ${HISTORICAL_OHLC_CAPTURE_INTERVALS:-FIFTEEN_MINUTES,ONE_HOUR,FOUR_HOURS}
      ORDER_BOOK_EVIDENCE_CAPTURE_ENABLED: ${ORDER_BOOK_EVIDENCE_CAPTURE_ENABLED:-false}
      ORDER_BOOK_EVIDENCE_CAPTURE_PROVIDER_SYMBOL: ${ORDER_BOOK_EVIDENCE_CAPTURE_PROVIDER_SYMBOL:-PF_XBTUSD}
      ORDER_BOOK_EVIDENCE_CAPTURE_DEPTH: ${ORDER_BOOK_EVIDENCE_CAPTURE_DEPTH:-25}
      ORDER_BOOK_ACQUISITION_STARTUP_ENABLED: ${ORDER_BOOK_ACQUISITION_STARTUP_ENABLED:-true}
      ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_PROVIDER: ${ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_PROVIDER:-KRAKEN}
      ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_SYMBOL: ${ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_SYMBOL:-BTC/USD}
      ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_PRODUCT_TYPE: ${ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_PRODUCT_TYPE:-LINEAR_PERPETUAL}
      ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_PROVIDER_SYMBOL: ${ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_PROVIDER_SYMBOL:-PF_XBTUSD}
      ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_DEPTH: ${ORDER_BOOK_ACQUISITION_DESIRED_SUBSCRIPTIONS_0_DEPTH:-25}

    networks:
      - trading-network

    restart: unless-stopped

  market-intelligence:
    build: ./market-intelligence
    container_name: market-intelligence
    depends_on:
      - eureka-server
      - market-data
      - broker-service
      - market-intelligence-db
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MARKET_INTELLIGENCE_DB_URL: jdbc:postgresql://market-intelligence-db:5432/market_intelligence
      MARKET_INTELLIGENCE_DB_USERNAME: postgres
      MARKET_INTELLIGENCE_DB_PASSWORD: postgres
      SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SECURITY_JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      MARKET_INTELLIGENCE_SERVICE_JWT_SECRET: ${MARKET_INTELLIGENCE_SERVICE_JWT_SECRET:?MARKET_INTELLIGENCE_SERVICE_JWT_SECRET must be set}
      TRADING_CORE_MI_SERVICE_JWT_SECRET: ${TRADING_CORE_MI_SERVICE_JWT_SECRET:?TRADING_CORE_MI_SERVICE_JWT_SECRET must be set}
      TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET: ${TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET:?TRADING_CORE_MARKET_DATA_SERVICE_JWT_SECRET must be set}
      MARKET_INTELLIGENCE_MARKET_DATA_SERVICE_JWT_SECRET: ${MARKET_INTELLIGENCE_MARKET_DATA_SERVICE_JWT_SECRET:-${MARKET_INTELLIGENCE_SERVICE_JWT_SECRET:?MARKET_INTELLIGENCE_SERVICE_JWT_SECRET must be set}}
      MARKET_INTELLIGENCE_BROKER_SERVICE_JWT_SECRET: ${MARKET_INTELLIGENCE_BROKER_SERVICE_JWT_SECRET:?MARKET_INTELLIGENCE_BROKER_SERVICE_JWT_SECRET must be set}
      MARKET_INTELLIGENCE_NEWS_SERVICE_JWT_SECRET: ${MARKET_INTELLIGENCE_NEWS_SERVICE_JWT_SECRET:-${NEWS_SERVICE_JWT_SECRET:?NEWS_SERVICE_JWT_SECRET must be set}}
      MARKET_INTELLIGENCE_ELIGIBILITY_INTERVAL: ${MARKET_INTELLIGENCE_ELIGIBILITY_INTERVAL:-ONE_HOUR}
      MARKET_INTELLIGENCE_ELIGIBILITY_ACTIVITY_WINDOW_MINUTES: ${MARKET_INTELLIGENCE_ELIGIBILITY_ACTIVITY_WINDOW_MINUTES:-180}
      MARKET_INTELLIGENCE_ELIGIBILITY_READINESS_LOOKBACK_CANDLES: ${MARKET_INTELLIGENCE_ELIGIBILITY_READINESS_LOOKBACK_CANDLES:-24}
      MARKET_INTELLIGENCE_ELIGIBILITY_MINIMUM_COMPLETED_CANDLES: ${MARKET_INTELLIGENCE_ELIGIBILITY_MINIMUM_COMPLETED_CANDLES:-12}
      MARKET_INTELLIGENCE_ELIGIBILITY_MAX_OBSERVATION_AGE_SECONDS: ${MARKET_INTELLIGENCE_ELIGIBILITY_MAX_OBSERVATION_AGE_SECONDS:-7200}
      MARKET_INTELLIGENCE_MAX_MARKET_FACT_EVALUATIONS_PER_SCAN: ${MARKET_INTELLIGENCE_MAX_MARKET_FACT_EVALUATIONS_PER_SCAN:-10}
      RESEARCH_LIFECYCLE_ENABLED: ${RESEARCH_LIFECYCLE_ENABLED:-false}
      RESEARCH_LIFECYCLE_MARKET_IDS: ${RESEARCH_LIFECYCLE_MARKET_IDS:-}
      RESEARCH_LIFECYCLE_OBSERVATION_CADENCE: ${RESEARCH_LIFECYCLE_OBSERVATION_CADENCE:-PT1H}
      RESEARCH_LIFECYCLE_OUTCOME_HORIZONS: ${RESEARCH_LIFECYCLE_OUTCOME_HORIZONS:-PT1H,PT4H,PT24H}
      RESEARCH_LIFECYCLE_FEE_COVERAGE_BROKER_ACCOUNT_ID: ${RESEARCH_LIFECYCLE_FEE_COVERAGE_BROKER_ACCOUNT_ID:-}
      RESEARCH_LIFECYCLE_FEE_COVERAGE_PROVIDER: ${RESEARCH_LIFECYCLE_FEE_COVERAGE_PROVIDER:-}
      RESEARCH_LIFECYCLE_FEE_COVERAGE_PRODUCT_TYPE: ${RESEARCH_LIFECYCLE_FEE_COVERAGE_PRODUCT_TYPE:-}
      RESEARCH_LIFECYCLE_FEE_COVERAGE_INSTRUMENT: ${RESEARCH_LIFECYCLE_FEE_COVERAGE_INSTRUMENT:-}
    networks:
      - trading-network
    restart: unless-stopped

  news-db:
    image: postgres:16
    container_name: news-postgres
    environment:
      POSTGRES_DB: news_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - news_data:/var/lib/postgresql/data
    networks:
      - trading-network
    restart: unless-stopped

  news-service:
    build: ./news-service
    container_name: news-service
    depends_on:
      - eureka-server
      - news-db
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      NEWS_DATABASE_URL: jdbc:postgresql://news-db:5432/news_service
      NEWS_DATABASE_USERNAME: postgres
      NEWS_DATABASE_PASSWORD: postgres
      NEWS_PROVIDER_ENABLED: ${NEWS_PROVIDER_ENABLED:-true}
      NEWS_XOOMAR_ENABLED: ${NEWS_XOOMAR_ENABLED:-true}
      NEWS_ALPHA_VANTAGE_ENABLED: ${NEWS_ALPHA_VANTAGE_ENABLED:-false}
      NEWS_ALPHA_VANTAGE_POLLING_ENABLED: ${NEWS_ALPHA_VANTAGE_POLLING_ENABLED:-false}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SECURITY_JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER must be set}
      MARKET_INTELLIGENCE_NEWS_SERVICE_JWT_SECRET: ${MARKET_INTELLIGENCE_NEWS_SERVICE_JWT_SECRET:-${NEWS_SERVICE_JWT_SECRET:?NEWS_SERVICE_JWT_SECRET must be set}}
    ports:
      - "17086:8085"
    networks:
      - trading-network
    restart: unless-stopped



networks:
  trading-network:
    driver: bridge


volumes:
  market_data:
  trading_os:
  broker_data:
  market_intelligence_data:
  news_data:
