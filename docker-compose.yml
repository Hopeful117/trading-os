
services:
  postgres:
    image: postgres:16
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    networks:
      - trading-network
    volumes:
      - trading_os:/var/lib/postgresql/data

    restart: unless-stopped


  market-data-db:
    image: postgres:16
    container_name: market_data-postgres

    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - market_data:/var/lib/postgresql/data

    networks:
      - trading-network


    restart: unless-stopped


  trading-app:
    build: ./trading-core
    container_name: trading-app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/trading_os
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_ISSUER: ${JWT_ISSUER}
    depends_on:
      - postgres
      - eureka-server
    ports:
      - "8081:8081"

    networks:
      - trading-network

    restart: unless-stopped

  broker-service:
    build: ./broker-service
    container_name: broker-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      KRAKEN_BASE_URL: ${KRAKEN_BASE_URL}
      KRAKEN_API_KEY: ${KRAKEN_API_KEY}
      KRAKEN_API_SECRET: ${KRAKEN_API_SECRET}

    depends_on:
      - eureka-server

    networks:
      - trading-network



    ports:
      - "8082:8082"

    restart: unless-stopped



  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8761:8761"

    networks:
        - trading-network

    restart: unless-stopped



  gateway:
    build: ./gateway
    container_name: gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_ISSUER: ${JWT_ISSUER}
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
        - trading-network


  trading-web:
    build: ./trading-os-web
    container_name: trading-web
    ports:
      - "4200:80"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - trading-network




  market-data:
    build: ./market-data
    container_name: market-data

    ports:
      - "8083:8083"

    depends_on:
      - eureka-server
      - market-data-db

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      KRAKEN_BASE_URL: ${KRAKEN_BASE_URL}
      KRAKEN_WEBSOCKET: ${KRAKEN_WEBSOCKET}

    networks:
      - trading-network

    restart: unless-stopped

  market-intelligence:
    build: ./market-intelligence
    container_name: market-intelligence
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - market-data
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    networks:
      - trading-network
    restart: unless-stopped



networks:
  trading-network:
    driver: bridge


volumes:
  market_data:
  trading_os:
