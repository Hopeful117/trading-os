
services:
  postgres:
    image: postgres:16
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    networks:
      - trading-network

    restart: unless-stopped


  trading-app:
    build: ./trading-core
    container_name: trading-app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/trading_os
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_ISSUER: ${JWT_ISSUER}
    depends_on:
      - postgres
    ports:
      - "8081:8081"

    networks:
      - trading-network

    restart: unless-stopped

  broker-service:
    build: ./broker-service
    container_name: broker-service
    environment:
      KRAKEN_BASE_URL: ${KRAKEN_BASE_URL}
      KRAKEN_API_KEY: ${KRAKEN_API_KEY}
      KRAKEN_API_SECRET: ${KRAKEN_API_SECRET}

    networks:
      trading-network:

    ports:
      - "8082:8082"

    restart: unless-stopped



  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

    networks:
        - trading-network

    restart: unless-stopped



  gateway:
    build: ./gateway
    container_name: gateway
    environment:
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_ISSUER: ${JWT_ISSUER}
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
        - trading-network


  trading-web:
    build: ./trading-os-web
    container_name: trading-web
    ports:
      - "4200:80"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - trading-network




  market-data:
    build: ./market-data
    container_name: market-data

    ports:
      - "8083:8083"

    depends_on:
      - eureka-server

    environment:
      KRAKEN_BASE_URL: ${KRAKEN_BASE_URL}

    networks:
      - trading-network

    restart: unless-stopped



networks:
  trading-network:
    driver: bridge
