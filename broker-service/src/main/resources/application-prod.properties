logging.structured.format.console=logstash
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
security.service-jwt.enabled=true
security.service-jwt.secret=${BROKER_SERVICE_SERVICE_JWT_SECRET}
security.service-jwt.trusted.trading-core=${TRADING_CORE_SERVICE_JWT_SECRET}
security.service-jwt.trusted.market-intelligence=${MARKET_INTELLIGENCE_BROKER_SERVICE_JWT_SECRET}
security.service-jwt.authorized-callers=trading-core,market-intelligence
trading-os.broker.credentials.source=stored
