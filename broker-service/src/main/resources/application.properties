spring.application.name=broker-service
server.port=8082

kraken.base-url=${KRAKEN_BASE_URL}
kraken.api-key=${KRAKEN_API_KEY:}
kraken.api-secret=${KRAKEN_API_SECRET:}
kraken.connect-timeout=5s
kraken.read-timeout=18s

spring.datasource.url=${BROKER_DATABASE_URL:jdbc:postgresql://postgres:5432/broker_service}
spring.datasource.username=${BROKER_DATABASE_USERNAME:postgres}
spring.datasource.password=${BROKER_DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}

trading-os.secrets.master-key=${BROKER_MASTER_KEY:}
trading-os.secrets.key-version=${BROKER_MASTER_KEY_VERSION:v1}
trading-os.broker.credentials.source=${BROKER_CREDENTIAL_SOURCE:stored}
trading-os.broker.credentials.allow-environment-in-production=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hope.trading=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
