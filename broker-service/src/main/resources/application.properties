spring.application.name=broker-service
server.port=8082

kraken.base-url=${KRAKEN_BASE_URL}
kraken.futures-base-url=${KRAKEN_FUTURES_BASE_URL:https://futures.kraken.com}
kraken.api-key=${KRAKEN_API_KEY:}
kraken.api-secret=${KRAKEN_API_SECRET:}
kraken.connect-timeout=5s
kraken.read-timeout=18s
kraken.read-max-attempts=${KRAKEN_READ_MAX_ATTEMPTS:3}
kraken.requests-per-second=${KRAKEN_REQUESTS_PER_SECOND:15}
kraken.capability-version=${KRAKEN_CAPABILITY_VERSION:1}
kraken.margin-currency=${KRAKEN_MARGIN_CURRENCY:USD}
kraken.supported-leverage-levels=${KRAKEN_SUPPORTED_LEVERAGE_LEVELS:1}
kraken.supported-instruments=${KRAKEN_SUPPORTED_INSTRUMENTS:}

spring.datasource.url=${BROKER_DATABASE_URL:jdbc:postgresql://postgres:5432/broker_service}
spring.datasource.username=${BROKER_DATABASE_USERNAME:postgres}
spring.datasource.password=${BROKER_DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

historical-fee-schedule.capture.enabled=${HISTORICAL_FEE_SCHEDULE_CAPTURE_ENABLED:false}
historical-fee-schedule.capture.fixed-delay=${HISTORICAL_FEE_SCHEDULE_CAPTURE_FIXED_DELAY:PT1H}
historical-fee-schedule.capture.broker-account-ids=${HISTORICAL_FEE_SCHEDULE_CAPTURE_BROKER_ACCOUNT_IDS:}
historical-fee-schedule.capture.instrument=${HISTORICAL_FEE_SCHEDULE_CAPTURE_INSTRUMENT:PF_XBTUSD}
historical-fee-schedule.capture.product-type=${HISTORICAL_FEE_SCHEDULE_CAPTURE_PRODUCT_TYPE:LINEAR_PERPETUAL}

broker-revocation.reconciliation.enabled=${BROKER_REVOCATION_RECONCILIATION_ENABLED:true}
broker-revocation.reconciliation.fixed-delay=${BROKER_REVOCATION_RECONCILIATION_FIXED_DELAY:PT30S}
broker-revocation.reconciliation.retry-delay=${BROKER_REVOCATION_RECONCILIATION_RETRY_DELAY:PT30S}
broker-revocation.reconciliation.lease-duration=${BROKER_REVOCATION_RECONCILIATION_LEASE_DURATION:PT60S}
broker-revocation.reconciliation.max-attempts=${BROKER_REVOCATION_RECONCILIATION_MAX_ATTEMPTS:10}
broker-revocation.reconciliation.batch-size=${BROKER_REVOCATION_RECONCILIATION_BATCH_SIZE:50}

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
security.service-jwt.enabled=${SERVICE_JWT_ENABLED:false}
security.service-jwt.name=broker-service
security.service-jwt.secret=${BROKER_SERVICE_SERVICE_JWT_SECRET:}
security.service-jwt.expiration-seconds=${SERVICE_JWT_EXPIRATION_SECONDS:60}
security.service-jwt.authorized-callers=trading-core,market-intelligence
security.service-jwt.trusted.market-intelligence=${MARKET_INTELLIGENCE_BROKER_SERVICE_JWT_SECRET:}

trading-os.secrets.master-key=${BROKER_MASTER_KEY:}
trading-os.secrets.key-version=${BROKER_MASTER_KEY_VERSION:v1}
trading-os.broker.credentials.source=${BROKER_CREDENTIAL_SOURCE:stored}
trading-os.broker.credentials.allow-environment-in-production=false

ctrader.client-id=${CTRADER_CLIENT_ID:}
ctrader.client-secret=${CTRADER_CLIENT_SECRET:}
ctrader.redirect-uri=${CTRADER_REDIRECT_URI:http://localhost:8082/api/v1/broker-accounts/ctrader/authorization/callback}
ctrader.authorization-endpoint=${CTRADER_AUTHORIZATION_ENDPOINT:https://id.ctrader.com/my/settings/openapi/grantingaccess/}
ctrader.environment=${CTRADER_ENVIRONMENT:demo}
ctrader.token-endpoint=${CTRADER_TOKEN_ENDPOINT:https://openapi.ctrader.com/apps/token}
ctrader.websocket-endpoint=${CTRADER_WEBSOCKET_ENDPOINT:wss://demo.ctraderapi.com:5036}
ctrader.authorization-state-ttl-seconds=${CTRADER_AUTHORIZATION_STATE_TTL_SECONDS:600}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hope.trading=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
