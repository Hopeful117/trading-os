name: Trading OS Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - eureka-server
          - gateway
          - broker-service
          - market-data
          - trading-core
          - market-intelligence
          - risk-domain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Maven cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # trading-core depends on the local risk-domain module, which is not
      # published to any repository. Provision it into the local Maven
      # repository so dependency resolution succeeds; risk-domain tests are
      # executed by its dedicated matrix job.
      - name: Provision local risk-domain artifact
        if: matrix.module == 'trading-core'
        working-directory: risk-domain
        run: |
          chmod +x ../trading-core/mvnw
          ../trading-core/mvnw -B -DskipTests install

      # market-intelligence and risk-domain have no wrapper; reuse the
      # trading-core wrapper as scripts/test-all.sh does.
      - name: Build and verify (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: |
          MVN="./mvnw"
          if [ ! -x "$MVN" ]; then
            chmod +x ../trading-core/mvnw
            MVN="../trading-core/mvnw"
          fi
          $MVN -B clean verify

      - name: Upload test results (${{ matrix.module }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/target/surefire-reports/*.xml
            ${{ matrix.module }}/target/failsafe-reports/*.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload JaCoCo report (${{ matrix.module }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          path: ${{ matrix.module }}/target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload compiled classes (${{ matrix.module }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classes-${{ matrix.module }}
          path: ${{ matrix.module }}/target/classes/
          if-no-files-found: warn
          retention-days: 30

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: trading-os-web/package-lock.json

      - name: Install dependencies
        working-directory: trading-os-web
        run: npm ci

      - name: Format check (Prettier)
        working-directory: trading-os-web
        run: npx prettier --check .

      - name: Unit tests with coverage (Vitest)
        working-directory: trading-os-web
        run: npm run test:coverage

      - name: Production build
        working-directory: trading-os-web
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-trading-os-web
          path: trading-os-web/coverage/**
          if-no-files-found: ignore
          retention-days: 30

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          path: coverage-backend

      - name: Backend JaCoCo summary
        env:
          PY_SUMMARY: |
            import glob
            import xml.etree.ElementTree as ET

            modules = ['eureka-server', 'gateway', 'broker-service',
                       'market-data', 'trading-core', 'market-intelligence',
                       'risk-domain']
            for module in modules:
                print(f'== {module} ==')
                matches = glob.glob(f'coverage-backend/jacoco-{module}/**/jacoco.xml', recursive=True)
                if not matches:
                    print('NO_REPORT')
                    continue
                root = ET.parse(matches[0]).getroot()
                counters = {c.get('type'): c for c in root.iter('counter')}
                for t in ('INSTRUCTION', 'LINE', 'BRANCH', 'COMPLEXITY', 'METHOD', 'CLASS'):
                    c = counters.get(t)
                    if c is None:
                        print(f'{t}: n/a')
                        continue
                    m, cv = int(c.get('missed')), int(c.get('covered'))
                    pct = 100.0 * cv / (m + cv) if m + cv else 0.0
                    print(f'{t}: {pct:.2f}% ({cv}/{m + cv})')
        run: python3 -c "$PY_SUMMARY"

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-trading-os-web
          path: coverage-frontend

      - name: Frontend coverage summary
        run: |
          if [ -d coverage-frontend ]; then
            grep -A6 -r "Coverage summary" coverage-frontend || true
          else
            echo "Frontend coverage artifact not available (frontend job failed or produced no output)."
          fi

  sonar-quality:
    name: SonarQube Quality — ${{ matrix.project }}
    runs-on: [self-hosted, linux, x64, engineering, sonarqube, trading-os]
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    needs: [backend-quality, frontend-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: risk-domain
            module: risk-domain
            secret: SONAR_TOKEN_RISK_DOMAIN
            type: backend
          - project: gateway
            module: gateway
            secret: SONAR_TOKEN_GATEWAY
            type: backend
          - project: eureka-server
            module: eureka-server
            secret: SONAR_TOKEN_EUREKA_SERVER
            type: backend
          - project: trading-core
            module: trading-core
            secret: SONAR_TOKEN_TRADING_CORE
            type: backend
          - project: broker-service
            module: broker-service
            secret: SONAR_TOKEN_BROKER_SERVICE
            type: backend
          - project: market-data
            module: market-data
            secret: SONAR_TOKEN_MARKET_DATA
            type: backend
          - project: market-intelligence
            module: market-intelligence
            secret: SONAR_TOKEN_MARKET_INTELLIGENCE
            type: backend
          - project: trading-os-web
            module: trading-os-web
            secret: SONAR_TOKEN_WEB
            type: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21 (Maven cache)
        if: matrix.type == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node 22 (npm cache)
        if: matrix.type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: trading-os-web/package-lock.json

      - name: Download JaCoCo reports (${{ matrix.module }})
        if: matrix.type == 'backend'
        uses: actions/download-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          path: ${{ matrix.module }}/target/site/jacoco/

      - name: Download compiled classes (${{ matrix.module }})
        if: matrix.type == 'backend'
        uses: actions/download-artifact@v4
        with:
          name: classes-${{ matrix.module }}
          path: ${{ matrix.module }}/target/classes/

      - name: Download frontend coverage
        if: matrix.type == 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: coverage-trading-os-web
          path: trading-os-web/coverage/

      - name: SonarQube Scan — ${{ matrix.project }}
        env:
          SONAR_TOKEN: ${{ secrets[matrix.secret] }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [ "${{ matrix.type }}" = "backend" ]; then
            cd "${{ matrix.module }}"
            mvn -B sonar:sonar \
              -Dsonar.projectKey=${{ matrix.project }} \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.token="$SONAR_TOKEN" \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.scm.revision="${{ github.sha }}"
          else
            cd trading-os-web
            npm ci
            npx sonar-scanner \
              -Dsonar.projectKey=${{ matrix.project }} \
              -Dsonar.host.url="$SONAR_HOST_URL" \
              -Dsonar.token="$SONAR_TOKEN" \
              -Dsonar.sources=src \
              -Dsonar.tests=src \
              -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.scm.revision="${{ github.sha }}"
          fi

  quality-gate:
    name: Trading OS Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    if: always()
    steps:
      - name: Evaluate mandatory jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          failed=0
          for job in $RESULTS; do
            if [ "$job" != "success" ]; then
              echo "Mandatory job result: $job"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Trading OS Quality Gate failed — one or more mandatory jobs did not succeed."
            exit 1
          fi
          echo "All mandatory quality jobs succeeded."
