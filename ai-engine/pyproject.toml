[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-os-ai-engine"
version = "0.1.0"
description = "Shadow-mode Market Thesis interpretation service for Trading OS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "cryptography>=43,<46",
    "openai>=1.68,<4",
    "PyJWT>=2.9,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
